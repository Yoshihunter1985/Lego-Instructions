<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4, user-scalable=yes">
<title>Brick Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'LegoTitle';
    src:url('LEGO.ttf') format('truetype');
    font-display:swap;
  }
  @font-face{
    font-family:'LegoThick';
    src:url('Legothick.ttf') format('truetype');
    font-display:swap;
  }
  :root{
    --bg:#F4EFE2;
    --bg-deep:#E7DFC9;
    --ink:#23211B;
    --ink-soft:#5C584C;
    --card:#FFFCF4;
    --line:#D8CFB4;
    --red:#D6321D;
    --yellow:#F4B400;
    --blue:#1768AC;
    --green:#1C8A5A;
    --shadow: 0 6px 0 rgba(35,33,27,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background-color:var(--bg);
    background-image: url('Lego%20dull%20background.png');
    background-size: 480px;
    background-repeat: repeat;
    background-attachment: fixed;
    color:var(--ink);
    font-family:'Nunito',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{max-width:920px;margin:0 auto;padding:22px 18px 60px;}

  header.top{
    display:flex;align-items:center;gap:14px;
    margin-bottom:22px;
    background:rgba(244,239,226,0.9);
    backdrop-filter: blur(4px);
    border-radius:16px;
    padding:14px 18px;
    box-shadow: var(--shadow);
  }
  .lego-badge{
    font-family:'LegoTitle',sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.5px;
    color:#fff;
    background:var(--red);
    border:4px solid var(--yellow);
    border-radius:8px;
    padding:6px 16px 8px;
    line-height:1;
    -webkit-text-stroke: 1.5px #1a1108;
    text-shadow:
      2px 0 0 #1a1108, -2px 0 0 #1a1108,
      0 2px 0 #1a1108, 0 -2px 0 #1a1108,
      2px 2px 0 #1a1108, -2px -2px 0 #1a1108,
      2px -2px 0 #1a1108, -2px 2px 0 #1a1108;
    box-shadow: var(--shadow);
    display:inline-block;
  }
  .brand-sub{
    font-family:'Nunito';font-weight:800;font-size:12px;color:var(--ink-soft);
    letter-spacing:1.5px;text-transform:uppercase;
  }

  .crumb{
    display:flex;align-items:center;gap:10px;margin-bottom:18px;
    background:rgba(244,239,226,0.9);
    backdrop-filter: blur(4px);
    border-radius:14px;
    padding:10px 14px;
  }
  .back-btn{
    font-family:'LegoTitle',sans-serif;font-weight:700;font-size:15px;
    background:var(--card);border:2px solid var(--line);border-radius:10px;
    padding:8px 14px 8px 10px;cursor:pointer;color:var(--ink);
    box-shadow: 0 4px 0 var(--line);
    display:flex;align-items:center;gap:6px;
  }
  .back-btn:active{transform:translateY(3px);box-shadow:none;}
  .crumb-label{font-family:'LegoTitle',sans-serif;font-weight:700;font-size:20px;color:var(--ink);}

  /* Category grid: rendered as brick tiles */
  .brick-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:22px 18px;
  }
  .brick{
    appearance:none;border:none;cursor:pointer;text-align:left;
    background:var(--brick-color);
    border-radius:10px;
    padding:16px 16px;
    position:relative;
    min-height:108px;
    box-shadow: var(--shadow);
    transition: transform .08s ease, box-shadow .08s ease;
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
  }
  .brick:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(35,33,27,0.16);}
  .brick.has-logo .theme-count{position:relative;z-index:1;}
  .brick .theme-name{
    font-family:'LegoTitle',sans-serif;font-weight:700;font-size:23px;
    line-height:1.15;
    display:block;
    margin-bottom:6px;
    text-shadow: 0 2px 3px rgba(0,0,0,0.45);
  }
  .brick .theme-count{
    font-family:'Nunito';font-weight:800;font-size:12.5px;
    opacity:.92; letter-spacing:.4px; text-transform:uppercase;
    background:rgba(255,255,255,0.22);
    display:inline-block;padding:3px 9px;border-radius:20px;
  }

  /* Set grid */
  .brick.has-logo{
    background-size: cover;
    background-position: center;
    background-color: var(--brick-color);
  }
  .brick.has-logo::after{
    content:'';position:absolute;inset:0;border-radius:10px;
    background:linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.55) 100%);
  }
  .brick.has-logo .theme-count{position:relative;z-index:1;}

  .set-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
    gap:20px;
  }
  .set-card{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    box-shadow: 0 5px 0 var(--line);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .set-card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line);}
  .set-thumb{
    aspect-ratio:1/1;
    background:var(--bg-deep);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .set-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .set-thumb .pdf-pill{
    position:absolute;bottom:7px;right:7px;
    background:var(--red);color:#fff;
    font-family:'LegoTitle';font-weight:700;font-size:11px;
    padding:3px 8px;border-radius:8px;
    letter-spacing:.5px;
  }
  .set-info{padding:10px 12px 13px;}
  .set-number{
    font-family:'Nunito';font-weight:900;font-size:11.5px;color:var(--ink-soft);
    letter-spacing:.6px;
  }
  .set-name{
    font-family:'LegoTitle',sans-serif;font-weight:600;font-size:16px;
    margin-top:2px;line-height:1.2;
    color:#000;
  }

  .state-msg{
    font-family:'LegoTitle',sans-serif;font-weight:600;font-size:17px;
    color:var(--ink-soft);
    text-align:center;padding:50px 20px;
    background:rgba(244,239,226,0.9);
    backdrop-filter: blur(4px);
    border-radius:16px;
  }
  /* Full-screen viewer mode */
  body.viewing .wrap{
    max-width:none;padding:8px;
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;
  }
  body.viewing header.top{display:none;}
  body.viewing .crumb{margin-bottom:8px;padding:6px 10px;flex:0 0 auto;}
  body.viewing #content{flex:1;min-height:0;display:flex;flex-direction:column;}
  .pdf-viewer-wrap{
    flex:1;min-height:0;
    display:flex;flex-direction:column;
    background:rgba(244,239,226,0.95);
    border-radius:14px;
    padding:6px;
    box-shadow: var(--shadow);
  }
  .pdf-canvas-stage{
    flex:1;min-height:0;
    overflow:auto;
    background:#fff;
    border-radius:10px;
    display:flex;
    touch-action: pan-x pan-y pinch-zoom;
  }
  .pdf-canvas-stage canvas{
    display:block;
    margin:auto;
    flex:0 0 auto;
  }
  .pdf-controls{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;gap:14px;
    padding-top:8px;
  }
  .pdf-controls button{
    font-family:'LegoTitle',sans-serif;font-weight:700;font-size:20px;
    width:52px;height:44px;border-radius:10px;border:none;cursor:pointer;
    background:var(--blue);color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,0.18);
  }
  .pdf-controls button:disabled{background:var(--line);color:var(--ink-soft);cursor:default;box-shadow:none;}
  .pdf-controls button:active:not(:disabled){transform:translateY(3px);box-shadow:none;}
  .pdf-page-label{
    font-family:'LegoTitle',sans-serif;font-weight:600;font-size:15px;color:var(--ink);
    min-width:100px;text-align:center;
  }
  .pdf-fallback a{
    font-family:'LegoTitle',sans-serif;font-weight:600;font-size:12px;
    color:var(--blue);text-decoration:none;margin-left:6px;
  }
  .state-msg .big{font-size:40px;display:block;margin-bottom:10px;}

  .pulse{animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

  @media (prefers-reduced-motion: reduce){ .pulse{animation:none;} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="lego-badge">Brick Vault</span>
    <span class="brand-sub" id="ownerLabel">Lego instructions</span>
  </header>

  <div id="crumb" class="crumb" style="display:none;">
    <button class="back-btn" id="backBtn">&larr; Themes</button>
    <span class="crumb-label" id="crumbLabel"></span>
  </div>

  <div id="content"></div>
</div>

<script>
/* ---------- CONFIG ---------- */
const GH_USER = "Yoshihunter1985";
const GH_REPO = "Lego-Instructions";
const GH_BRANCH = "main";

const API_ROOT = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents`;
const RAW_ROOT = '.'; // files are served from this site itself (GitHub Pages), same origin as the app

const BRICK_COLORS = ["#D6321D","#1768AC","#1C8A5A","#F4B400","#8E44AD","#E07B1A"];
function colorFor(name){
  let h = 0;
  for(const ch of name) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  return BRICK_COLORS[h % BRICK_COLORS.length];
}

const content = document.getElementById('content');
const crumb = document.getElementById('crumb');
const crumbLabel = document.getElementById('crumbLabel');
document.getElementById('backBtn').onclick = () => {
  if(location.hash.startsWith('#/view/')){
    const folderEncoded = location.hash.slice('#/view/'.length).split('/')[0];
    location.hash = `#/${folderEncoded}`;
  } else {
    location.hash = '';
  }
};

function loadingState(label){
  content.innerHTML = `<div class="state-msg pulse"><span class="big">&#129683;</span>${label}</div>`;
}
function errorState(label){
  content.innerHTML = `<div class="state-msg"><span class="big">&#9888;&#65039;</span>${label}</div>`;
}

async function ghList(path=""){
  const res = await fetch(`${API_ROOT}/${path}`);
  if(!res.ok) throw new Error(`GitHub API error ${res.status}`);
  return res.json();
}

/* Parse a folder's files into sets, pairing "NUM - Name pic.jpg" with "NUM - Name.pdf" */
function buildSets(files, folderPath){
  const map = {};
  for(const f of files){
    if(f.type !== 'file') continue;
    if(/logo/i.test(f.name)) continue;
    const m = f.name.match(/^(.+?)\.(jpg|jpeg|png|webp|pdf)$/i);
    if(!m) continue;
    let stem = m[1].trim();
    const ext = m[2].toLowerCase();
    const isImage = ext !== 'pdf';
    if(isImage) stem = stem.replace(/\s*pic\s*$/i,'').trim();

    const numMatch = stem.match(/^(\d+)\s*-\s*(.+)$/);
    const number = numMatch ? numMatch[1] : '';
    const name = numMatch ? numMatch[2].trim() : stem;
    const key = number ? number : stem;

    if(!map[key]) map[key] = { number, name, image:null, pdf:null };
    if(isImage && !map[key].image) map[key].image = `${RAW_ROOT}/${folderPath}/${encodeURIComponent(f.name)}`;
    if(ext === 'pdf') map[key].pdf = `${RAW_ROOT}/${folderPath}/${encodeURIComponent(f.name)}`;
  }
  return Object.values(map).sort((a,b)=> (a.number||'').localeCompare(b.number||'', undefined, {numeric:true}));
}

async function renderHome(){
  crumb.style.display = 'none';
  loadingState('Tipping out the brick bin&hellip;');
  try{
    const items = await ghList();
    const folders = items.filter(i => i.type === 'dir');
    if(folders.length === 0){
      errorState('No theme folders yet. Add one to the repo to get started.');
      return;
    }
    const counts = await Promise.all(folders.map(f => ghList(encodeURIComponent(f.name)).catch(()=>[])));

    content.innerHTML = `<div class="brick-grid">${
      folders.map((f,i) => {
        const fileCount = counts[i].filter(x=>x.type==='file' && /\.(pdf)$/i.test(x.name)).length;
        const logoFile = counts[i].find(x => x.type==='file' && /logo/i.test(x.name) && /\.(jpg|jpeg|png|webp)$/i.test(x.name));
        const logoUrl = logoFile ? `${RAW_ROOT}/${encodeURIComponent(f.name)}/${encodeURIComponent(logoFile.name)}` : null;
        const styleAttr = logoUrl
          ? `--brick-color:${colorFor(f.name)};background-image:url('${logoUrl}')`
          : `--brick-color:${colorFor(f.name)}`;
        return `
        <button class="brick${logoUrl ? ' has-logo' : ''}" style="${styleAttr}" data-folder="${encodeURIComponent(f.name)}">
          ${logoUrl ? '' : `<span class="theme-name">${f.name}</span>`}
          <span class="theme-count">${fileCount} set${fileCount===1?'':'s'}</span>
        </button>`;
      }).join('')
    }</div>`;

    content.querySelectorAll('.brick').forEach(btn=>{
      btn.onclick = () => { location.hash = `#/${btn.dataset.folder}`; };
    });
  }catch(e){
    errorState("Couldn't reach the brick bin. Check your connection and try again.");
  }
}

async function renderCategory(folderEncoded){
  const folderName = decodeURIComponent(folderEncoded);
  crumb.style.display = 'flex';
  crumbLabel.textContent = folderName;
  loadingState(`Sorting the ${folderName} sets&hellip;`);
  try{
    const files = await ghList(folderEncoded);
    const sets = buildSets(files, folderEncoded);
    if(sets.length === 0){
      errorState('No sets found in this theme yet.');
      return;
    }
    content.innerHTML = `<div class="set-grid">${
      sets.map(s => `
        <div class="set-card" data-pdf="${s.pdf ? s.pdf : ''}">
          <div class="set-thumb">
            ${s.image ? `<img src="${s.image}" alt="${s.name}" loading="lazy">` : ''}
            ${s.pdf ? `<span class="pdf-pill">PDF</span>` : ''}
          </div>
          <div class="set-info">
            <div class="set-number">${s.number ? '#'+s.number : ''}</div>
            <div class="set-name">${s.name}</div>
          </div>
        </div>`).join('')
    }</div>`;

    content.querySelectorAll('.set-card').forEach(card=>{
      const pdf = card.dataset.pdf;
      if(pdf) card.onclick = () => { location.hash = `#/view/${encodeURIComponent(folderEncoded)}/${encodeURIComponent(pdf)}`; };
    });
  }catch(e){
    errorState("Couldn't load this theme. Check your connection and try again.");
  }
}

let pdfState = { doc:null, pageNum:1, rendering:false };

function renderViewer(folderEncoded, pdfUrlEncoded){
  const pdfUrl = decodeURIComponent(pdfUrlEncoded);
  const folderName = decodeURIComponent(folderEncoded);
  crumb.style.display = 'flex';
  crumbLabel.textContent = 'Instructions';
  document.getElementById('backBtn').textContent = '\u2190 ' + folderName;

  content.innerHTML = `
    <div class="pdf-viewer-wrap">
      <div class="pdf-canvas-stage" id="pdfStage">
        <span class="state-msg pulse" style="border:none;background:none;">Opening instructions&hellip;</span>
      </div>
      <div class="pdf-controls">
        <button id="pdfPrev" disabled>&larr;</button>
        <span class="pdf-page-label" id="pdfPageLabel">&nbsp;</span>
        <button id="pdfNext" disabled>&rarr;</button>
        <span class="pdf-fallback"><a href="${pdfUrl}" target="_blank" rel="noopener">Open PDF</a></span>
      </div>
    </div>`;

  pdfState = { doc:null, pageNum:1, rendering:false };

  const task = pdfjsLib.getDocument({
    url: pdfUrl,
    rangeChunkSize: 1048576,   // fetch in 1MB pieces
    disableAutoFetch: true,    // only download pages as they're needed
    disableStream: false
  });
  task.onProgress = p => {
    const stage = document.getElementById('pdfStage');
    const msg = stage && stage.querySelector('.state-msg');
    if(!msg || pdfState.doc) return;
    msg.textContent = p.total
      ? `Opening instructions\u2026 ${Math.min(99, Math.round(p.loaded / p.total * 100))}%`
      : `Opening instructions\u2026 ${(p.loaded / 1048576).toFixed(1)} MB`;
  };
  task.promise.then(doc => {
    pdfState.doc = doc;
    pdfState.pageNum = 1;
    renderPdfPage();
  }).catch(err => {
    document.getElementById('pdfStage').innerHTML =
      `<span class="state-msg" style="border:none;background:none;">Couldn't load this PDF. Try "Open PDF" below.</span>`;
  });

  document.getElementById('pdfPrev').onclick = () => {
    if(pdfState.doc && pdfState.pageNum > 1){ pdfState.pageNum--; renderPdfPage(); }
  };
  document.getElementById('pdfNext').onclick = () => {
    if(pdfState.doc && pdfState.pageNum < pdfState.doc.numPages){ pdfState.pageNum++; renderPdfPage(); }
  };
}

function renderPdfPage(){
  if(!pdfState.doc) return;
  if(pdfState.rendering){ pdfState.again = true; return; }
  pdfState.rendering = true;
  const stage = document.getElementById('pdfStage');
  const label = document.getElementById('pdfPageLabel');
  const prevBtn = document.getElementById('pdfPrev');
  const nextBtn = document.getElementById('pdfNext');
  if(!stage){ pdfState.rendering = false; return; }

  pdfState.doc.getPage(pdfState.pageNum).then(page => {
    const base = page.getViewport({ scale: 1 });
    // Fit the WHOLE page inside the stage, keeping its true proportions
    const fit = Math.min(stage.clientWidth / base.width, stage.clientHeight / base.height);
    const cssW = Math.floor(base.width * fit);
    const cssH = Math.floor(base.height * fit);

    // Render at higher pixel density so it stays sharp (and when pinch-zoomed)
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let renderScale = fit * dpr * 1.25;
    const maxPx = 3000;
    renderScale = Math.min(renderScale, maxPx / base.width, maxPx / base.height);
    const viewport = page.getViewport({ scale: renderScale });

    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    const ctx = canvas.getContext('2d');

    return page.render({ canvasContext: ctx, viewport }).promise.then(() => {
      stage.innerHTML = '';
      stage.appendChild(canvas);
      label.textContent = `Page ${pdfState.pageNum} / ${pdfState.doc.numPages}`;
      prevBtn.disabled = pdfState.pageNum <= 1;
      nextBtn.disabled = pdfState.pageNum >= pdfState.doc.numPages;
    });
  }).catch(() => {}).then(() => {
    pdfState.rendering = false;
    if(pdfState.again){ pdfState.again = false; renderPdfPage(); }
  });
}

// Re-fit the page if the window changes size or the device rotates
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if(pdfState.doc) renderPdfPage(); }, 200);
});
window.addEventListener('keydown', e => {
  if(!pdfState.doc || !location.hash.startsWith('#/view/')) return;
  if(e.key === 'ArrowRight'){ document.getElementById('pdfNext')?.click(); }
  if(e.key === 'ArrowLeft'){ document.getElementById('pdfPrev')?.click(); }
});

function route(){
  const hash = location.hash;
  document.body.classList.toggle('viewing', hash.startsWith('#/view/'));
  if(!hash.startsWith('#/view/')) pdfState = { doc:null, pageNum:1, rendering:false };
  if(hash.startsWith('#/view/')){
    const parts = hash.slice('#/view/'.length).split('/');
    renderViewer(parts[0], parts.slice(1).join('/'));
  } else if(hash.startsWith('#/')){
    document.getElementById('backBtn').textContent = '\u2190 Themes';
    renderCategory(hash.slice(2));
  } else {
    renderHome();
  }
}
window.addEventListener('hashchange', route);
route();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>
</body>
</html>
